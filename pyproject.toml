[tool.poetry]
authors = ["Léni Gauffier <lenigauffier@gmail.com>"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Sociology :: History",
]
description = "History of astronomy library"
exclude = ["kanon/**/tests/**/*"]
homepage = "https://dishas.obspm.fr"
keywords = ["astronomy", "history", "arithmetic", "calendars", "ptolemy", "sexagesimal"]
license = "BSD-3-Clause"
name = "kanon"
packages = [
  {include = "kanon"},
]
readme = "README.rst"
repository = "https://github.com/legau/kanon"
version = "0.6.6.post46.dev0+16aca8d"

[docs.metadata]
edit_on_github = "True"
github_project = "legau/kanon"
long_description = "file: README.rst"
long_description_content_type = "text/x-rst"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
astropy = "^7.1"
matplotlib = "^3.10.0"
numpy = "^2.3.0"
pandas = "^2.3.1"
requests = "^2.32.4"
scipy = "^1.16.0"
nbformat = {version = "^5.10.4", optional = true}
nbsphinx = {version = "^0.9.7", optional = true}
papermill = {version = "^2.4.0", optional = true}
ipykernel = {version = "^6.30.0", optional = true}
ipython = {version = "^9.4.0", optional = true}
sphinx-astropy = {version = "^1.9.1", optional = true}
sphinx-rtd-theme = {version = ">=3,<4", optional = true}

[tool.poetry.dev-dependencies]
black = "*"
flake8 = "*"
isort = "*"
mypy = "*"
pre-commit = "*"
pytest-astropy = "^0.11.0"
requests-mock = "^1.12.1"
tox = "^4.28.1"
types-requests = "^2.32.4"

[tool.poetry.extras]
docs = ["sphinx-astropy", "nbsphinx", "ipython", "sphinx-rtd-theme", "ipykernel", "papermill"]
notebook = ["ipython", "ipykernel", "papermill", "nbformat"]

[tool.poetry-dynamic-versioning]
enable = false

[build-system]
build-backend = "poetry_dynamic_versioning.backend"
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]

[tool.pytest.ini_options]
addopts = "-p \"no:hypothesispytest\""
astropy_header = true
doctest_plus = "enabled"
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]
testpaths = ["kanon", "docs", "examples"]
text_file_format = "rst"

[tool.coverage.run]
omit = ["**/tests/*", "*/kanon/version*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "except ImportError",
  "raise AssertionError",
  "raise NotImplementedError",
  "pragma: py{ignore_python_version}",
  '\.\.\.$',
]

[tool.coverage.paths]
source = [
  "kanon",
  "*/.tox/*/lib/python*/site-packages/kanon",
  "*/kanon",
]

[tool.mypy]
files = ["kanon"]

[[tool.mypy.overrides]]
module = [
    'astropy.*',
    'requests_mock.*',
    'pandas.*',
    'setuptools_scm.*',
    'scipy.*',
    'matplotlib.*',
]
ignore_missing_imports = true
